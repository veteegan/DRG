name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Link tải file IPA game ARK gốc để tự động inject (để trống nếu chỉ cần dylib/IPA wrapper)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect Targets
        run: |
          xcodebuild -project Dragon.xcodeproj -list

      - name: Build Project
        run: |
          TARGET_NAME=$(xcodebuild -project Dragon.xcodeproj -list | awk '/Targets:/{flag=1; next} /Build Configurations:/{flag=0} flag' | tr -d ' ' | head -n 1)
          if [ -z "$TARGET_NAME" ]; then
            TARGET_NAME="Sishen"
          fi
          echo "Building target: $TARGET_NAME"

          set -o pipefail
          xcodebuild -project Dragon.xcodeproj \
                     -target "$TARGET_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     CONFIGURATION_BUILD_DIR="${{ github.workspace }}/build/output" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build 2>&1 | tee xcodebuild.log || {
                       echo "================================================="
                       echo "=== BUILD FAILED - EXTRACTING RELEVANT ERRORS ==="
                       echo "================================================="
                       grep -E -C 3 "(error:|fatal error:|The following build commands failed:|\*\* BUILD FAILED \*\*)" xcodebuild.log || true
                       echo "================================================="
                       echo "=== LAST 100 LINES OF FULL BUILD LOG ==="
                       echo "================================================="
                       tail -n 100 xcodebuild.log
                       exit 1
                     }

      - name: Locate Built Files & Package Dylib
        run: |
          mkdir -p dist
          echo "=== Files in build/output ==="
          ls -la build/output

          DYLIB_PATH=$(find build/output -name "*.dylib" | head -n 1)
          if [ -n "$DYLIB_PATH" ]; then
            echo "Found dylib at: $DYLIB_PATH"
            cp "$DYLIB_PATH" dist/Dragon.dylib
            cd dist && zip -r Dragon_Dylib.zip Dragon.dylib && cd ..
          else
            echo "::error::No dylib found after build!"
            exit 1
          fi

      - name: Find or Create IPA Package
        run: |
          mkdir -p Payload/Dragon.app

          # 1. Neu co link tai IPA goc hoac co file .ipa san trong repo
          BASE_IPA=""
          if [ -n "${{ github.event.inputs.ipa_url }}" ]; then
            echo "Downloading base IPA from: ${{ github.event.inputs.ipa_url }}"
            curl -L -o base_game.ipa "${{ github.event.inputs.ipa_url }}"
            BASE_IPA="base_game.ipa"
          else
            BASE_IPA=$(find . -maxdepth 2 -name "*.ipa" ! -name "Dragon*.ipa" | head -n 1)
          fi

          if [ -n "$BASE_IPA" ] && [ -f "$BASE_IPA" ]; then
            echo "Injecting Dragon.dylib into base IPA: $BASE_IPA"
            unzip -q "$BASE_IPA" -d temp_ipa
            APP_FOLDER=$(find temp_ipa/Payload -maxdepth 1 -name "*.app" | head -n 1)

            if [ -n "$APP_FOLDER" ]; then
              cp dist/Dragon.dylib "$APP_FOLDER/"

              brew install optool || true
              MAIN_BIN=$(find "$APP_FOLDER" -maxdepth 1 -type f -perm +111 ! -name "*.dylib" ! -name "*.png" | head -n 1)
              if command -v optool &> /dev/null && [ -n "$MAIN_BIN" ]; then
                optool install -c load -p "@executable_path/Dragon.dylib" -t "$MAIN_BIN" || true
              fi

              cd temp_ipa && zip -qr ../Dragon_Injected.ipa Payload && cd ..
              mv Dragon_Injected.ipa dist/
              echo "Created dist/Dragon_Injected.ipa successfully!"
            fi
            rm -rf temp_ipa
          fi

          # 2. Tao IPA wrapper tieu chuan
          cat << 'EOF' > Payload/Dragon.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Dragon</string>
              <key>CFBundleIdentifier</key>
              <string>com.dragon.tweak</string>
              <key>CFBundleName</key>
              <string>Dragon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #import <dlfcn.h>
          int main(int argc, char * argv[]) {
              dlopen("@executable_path/Dragon.dylib", RTLD_NOW);
              return 0;
          }
          EOF
          xcrun -sdk iphoneos clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -framework UIKit -framework Foundation main.m -o Payload/Dragon.app/Dragon
          rm -f main.m

          cp dist/Dragon.dylib Payload/Dragon.app/
          zip -qr dist/Dragon_Standalone.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Build-Output
          path: |
            dist/*.ipa
            dist/*.zip
